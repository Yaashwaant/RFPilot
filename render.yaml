# Render Blueprint Specification for Proposal Assistant (RFPilot)
# Documentation: https://render.com/docs/blueprint-spec
version: "1"

services:
  # ─── 1. FastAPI Backend API Service ──────────────────────────────────────────
  - type: web
    name: rfpilot-api
    runtime: docker
    dockerContext: apps/api
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: rfpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rfpilot-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: local

  # ─── 2. Next.js Frontend Web Service ─────────────────────────────────────────
  - type: web
    name: rfpilot-web
    runtime: node
    rootDir: apps/web
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: rfpilot-api
          property: host

  # ─── 3. Celery Background Worker ─────────────────────────────────────────────
  - type: worker
    name: rfpilot-worker
    runtime: docker
    dockerContext: apps/api
    dockerfilePath: apps/api/Dockerfile
    dockerCommand: celery -A app.core.celery_app worker --loglevel=info -c 2
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rfpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rfpilot-redis
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false

  # ─── 4. Managed Redis Service ────────────────────────────────────────────────
  - type: redis
    name: rfpilot-redis
    plan: starter
    ipAllowList: [] # internal only

databases:
  # ─── 5. Managed PostgreSQL with pgvector ─────────────────────────────────────
  - name: rfpilot-db
    databaseName: proposal_assistant
    user: pa_user
    plan: starter
    postgresMajorVersion: "16"
